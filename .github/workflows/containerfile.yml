name: Containerfile

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        runtime:
          - wildfly
          - tomcat

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile.${{ matrix.runtime }}
          push: false
          load: true
          tags: clusterbench-${{ matrix.runtime }}
          cache-from: type=gha,scope=${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runtime }}

      - name: Start container
        run: |
          echo "CONTAINER_ID=$(docker run -d -p 8080:8080 clusterbench-${{ matrix.runtime }})" >> "$GITHUB_ENV"

      - name: Wait for server to start
        run: |
          echo "Waiting for ${{ matrix.runtime }} to be ready..."
          timeout=120
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -f -s http://localhost:8080/clusterbench/ > /dev/null 2>&1; then
              echo "${{ matrix.runtime }} is ready!"
              exit 0
            fi
            echo "Waiting... ($elapsed/$timeout seconds)"
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "Timeout waiting for ${{ matrix.runtime }} to start"
          exit 1

      - name: Test application response
        run: |
          echo "Testing application endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/clusterbench/session)
          if [ "$response" = "200" ]; then
            echo "Application is responding (HTTP $response)"
            # Also verify we get some content
            content=$(curl -s http://localhost:8080/clusterbench/session || true)
            if [ -n "$content" ]; then
              echo "Application returned content"
              exit 0
            else
              echo "Application returned empty response"
              exit 1
            fi
          else
            echo "Application returned unexpected status code: $response"
            exit 1
          fi

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "Container logs:"
          docker logs "$CONTAINER_ID" || true
